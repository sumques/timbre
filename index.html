<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>音色判读</title>
<style>
:root{--bg:#0a0e13;--pnl:#121820;--line:#1e2833;--fg:#e6edf3;--dim:#7d8b9a;--acc:#3ddc97;--warn:#ffb020;--red:#ff5d5d;--blue:#5aa9e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,"MiSans","PingFang SC","Noto Sans SC",system-ui,sans-serif}
body{padding:10px 12px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#3a4653;flex:none;transition:background .2s}
.dot.on{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.dot.err{background:var(--red)}
.spacer{flex:1}
button{font:inherit;color:var(--fg);background:var(--pnl);border:1px solid var(--line);
  border-radius:10px;padding:9px 14px;cursor:pointer}
button:active{background:#1a2330}
button.primary{border-color:var(--acc);color:var(--acc)}
.panel{background:var(--pnl);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
canvas{width:100%;height:132px;display:block;border-radius:8px;background:#080b10}
.frow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.fcell{background:#0c1219;border:1px solid #17202a;border-radius:8px;padding:6px 8px}
.fcell .l{font-size:10.5px;color:var(--dim)}
.fcell .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
#rule{font-size:13.5px;line-height:1.65}
#rule .r{color:var(--warn);font-weight:600}
#rule .fam{color:var(--acc);font-weight:700;font-size:16px}
#rule .sub{color:var(--dim);font-size:12px;margin-top:4px}
#rule .idle{color:var(--dim);font-size:13px}
ul.cand{list-style:none;margin:10px 0 0;padding:0}
ul.cand li{display:flex;align-items:center;gap:9px;padding:5px 0}
ul.cand .nm{width:70px;flex:none;font-size:12.5px}
.bar{flex:1;height:6px;background:#0c1116;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#2f4a5c;border-radius:4px;transition:width .12s}
ul.cand li:first-child .bar i{background:var(--blue)}
ul.cand .pc{width:34px;text-align:right;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;font-size:13px}
.tabs button.act{border-color:var(--acc);color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:6px 4px;border-bottom:1px solid #18202a;vertical-align:top}
td:first-child{color:var(--acc);white-space:nowrap;width:76px;font-weight:600}
.hide{display:none}
.msg{color:var(--warn);font-size:12.5px;padding:8px 0}
.note{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.6}
.warnbox{border-color:#4a3a12;background:#1a1608}
.warnbox .t{color:#d8b866;font-size:12px;line-height:1.6}
</style>
</head>
<body>

<div class="top">
  <span class="dot" id="dot"></span>
  <h1>音色判读</h1>
  <span class="spacer"></span>
  <button id="btn" class="primary">开始</button>
</div>

<div class="tabs">
  <button id="tabA" class="act">实时判读</button>
  <button id="tabB">谐波对照表</button>
</div>

<div id="viewA">
  <div class="panel">
    <canvas id="spec"></canvas>
    <div class="frow">
      <div class="fcell"><div class="l">基频 f0</div><div class="v" id="vF0">—</div></div>
      <div class="fcell"><div class="l">偶/奇次谐波</div><div class="v" id="vEO">—</div></div>
      <div class="fcell"><div class="l">谐波质心</div><div class="v" id="vCEN">—</div></div>
      <div class="fcell"><div class="l">高频谐波</div><div class="v" id="vHI">—</div></div>
      <div class="fcell"><div class="l">起音</div><div class="v" id="vATK">—</div></div>
      <div class="fcell"><div class="l">颤音</div><div class="v" id="vVIB">—</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="msg" id="msg" style="display:none"></div>
    <div id="rule"><span class="idle">按「开始」并授权麦克风</span></div>
    <ul class="cand" id="cand"></ul>
  </div>

  <div class="panel warnbox">
    <div class="t">测的是<strong>判据数值</strong>，不是答案。合成数据实测：候选排序 top-1 约 54%、top-3 约 91%，真实教室回放下更低。<strong>以规则命中的族为主判断，候选列表只当参考。</strong></div>
  </div>

  <div class="panel">
    <button id="freeze" style="width:100%">锁定当前读数</button>
    <div class="note">音源离手机 20~40 cm。教室音响会削掉低频，低音乐器（大号/低音提琴）读不出基频时会跳到泛音上——看「偶/奇次谐波」出现异常值就说明基频错了。</div>
  </div>
</div>

<div id="viewB" class="hide">
  <div class="panel"><table id="reftable"></table></div>
  <div class="panel"><table id="famtable"></table></div>
</div>

<script>
"use strict";

/* ===== 原型：由合成模板经特征提取反向标定 ===== */
const PROTO = [
  {n:"单簧管",  eo:-1.54, cen:3.86, hi:0.081, perc:0, noise:0.000, vib:0.00, reg:[150,2000], fam:"簧片"},
  {n:"笙",      eo:-0.96, cen:4.10, hi:0.105, perc:0, noise:0.000, vib:0.00, reg:[200,2000], fam:"簧片"},
  {n:"双簧管",  eo:-0.12, cen:3.89, hi:0.094, perc:0, noise:0.000, vib:0.16, reg:[230,1400], fam:"双簧"},
  {n:"长笛",    eo:-0.91, cen:1.46, hi:0.006, perc:0, noise:0.000, vib:0.11, reg:[260,2100], fam:"边棱"},
  {n:"笛子",    eo:-0.72, cen:1.81, hi:0.012, perc:0, noise:0.001, vib:0.15, reg:[290,2100], fam:"边棱"},
  {n:"小号",    eo:-0.05, cen:4.98, hi:0.282, perc:0, noise:0.000, vib:0.00, reg:[165,1000], fam:"铜管"},
  {n:"长号",    eo:-0.09, cen:4.38, hi:0.158, perc:0, noise:0.000, vib:0.00, reg:[80,600],   fam:"铜管"},
  {n:"圆号",    eo:-0.43, cen:1.91, hi:0.002, perc:0, noise:0.000, vib:0.00, reg:[65,700],   fam:"铜管"},
  {n:"大号",    eo:-0.30, cen:2.34, hi:0.009, perc:0, noise:0.000, vib:0.00, reg:[30,300],   fam:"铜管"},
  {n:"小提琴",  eo:-0.12, cen:4.12, hi:0.122, perc:0, noise:0.000, vib:0.52, reg:[196,3136], fam:"弓弦"},
  {n:"中提琴",  eo:-0.13, cen:3.95, hi:0.103, perc:0, noise:0.000, vib:0.51, reg:[130,2100], fam:"弓弦"},
  {n:"大提琴",  eo:-0.10, cen:4.04, hi:0.114, perc:0, noise:0.000, vib:0.35, reg:[65,1000],  fam:"弓弦"},
  {n:"低音提琴",eo:-0.13, cen:3.73, hi:0.076, perc:0, noise:0.000, vib:0.00, reg:[40,300],   fam:"弓弦"},
  {n:"二胡",    eo:-0.13, cen:4.06, hi:0.111, perc:0, noise:0.001, vib:0.63, reg:[290,1200], fam:"弓弦"},
  {n:"钢琴",    eo:-0.15, cen:4.06, hi:0.123, perc:1, noise:0.009, vib:0.00, reg:[27,4186],  fam:"键盘拨弦"},
  {n:"吉他",    eo:-0.11, cen:4.85, hi:0.184, perc:1, noise:0.015, vib:0.00, reg:[82,1300],  fam:"键盘拨弦"},
  {n:"琵琶",    eo:-0.05, cen:5.54, hi:0.354, perc:1, noise:0.023, vib:0.00, reg:[110,1200], fam:"键盘拨弦"},
  {n:"古筝",    eo:-0.05, cen:4.85, hi:0.248, perc:1, noise:0.017, vib:0.00, reg:[87,1300],  fam:"键盘拨弦"},
  {n:"竖琴",    eo:-0.17, cen:4.05, hi:0.127, perc:1, noise:0.007, vib:0.00, reg:[30,3000],  fam:"键盘拨弦"},
  {n:"管风琴",  eo:-0.14, cen:4.11, hi:0.113, perc:0, noise:0.000, vib:0.00, reg:[16,4000],  fam:"风琴"},
  {n:"手风琴",  eo:-0.12, cen:4.14, hi:0.122, perc:0, noise:0.001, vib:0.00, reg:[60,2000],  fam:"风琴"},
  {n:"木琴",    eo:-0.07, cen:6.03, hi:0.379, perc:1, noise:0.041, vib:0.00, reg:[500,4000], fam:"打击"},
  {n:"定音鼓",  eo:-0.03, cen:6.40, hi:0.644, perc:1, noise:0.054, vib:0.00, reg:[60,300],   fam:"打击"}
];

const SIG = {eo:0.30, cen:0.90, hi:0.10, perc:0.55, noise:0.18, vib:0.50};
const WGT = {eo:1.10, cen:1.00, hi:0.55, perc:1.25, noise:0.45, vib:0.35};
const REG_W = 1.4;
const DIMS = ["eo","cen","hi","perc","noise","vib"];

const REF = [
  ["无起音",  "声音平着出来、没有「啪」→ 管风琴"],
  ["只有奇次", "偶/奇 < 0.30，只剩 1/3/5 次 → 单簧管 / 笙（最硬的一条）"],
  ["质心极低", "谐波质心 < 2.0、几乎只有基频 → 长笛 / 笛子 / 圆号（靠气声分）"],
  ["高频很强", "第 9~12 次谐波 > 25% → 小号 / 琵琶 / 唢呐"],
  ["锯齿+颤音","质心 ~4、颤音明显 → 小提琴 / 中提琴 / 大提琴 / 二胡（靠音域分）"],
  ["起音锐利", "起音后 250ms 掉 >8 dB → 钢琴 / 吉他 / 琵琶 / 古筝 / 竖琴 / 木琴"],
  ["簧片拍频", "轻微「哇哇」颤动 → 手风琴"],
  ["低音区",  "f0 < 165 Hz 且谐波少 → 大号 / 低音提琴 / 定音鼓"]
];

const FAMINFO = [
  ["簧片",   "单簧管、笙：偶次谐波几乎消失，这条最可靠"],
  ["双簧",   "双簧管：偶次强、谐波密、带鼻音"],
  ["边棱",   "长笛、笛子：近乎纯音，只有基频 + 气声"],
  ["铜管",   "小号、长号、圆号、大号：高频谐波含量 + 音域共同决定"],
  ["弓弦",   "小提琴、中提琴、大提琴、低音提琴、二胡：同一机制，只能靠音域与颤音分"],
  ["键盘拨弦","钢琴、吉他、琵琶、古筝、竖琴：靠衰减速度与高频含量区分"],
  ["风琴",   "管风琴、手风琴：持续、无瞬态"],
  ["打击",   "木琴、定音鼓：噪声 + 非谐和分音"]
];

/* ================= 音频 ================= */
const $ = id => document.getElementById(id);
const FFT = 16384;        // 频谱：2.93 Hz/bin
const ENV_FFT = 2048;     // 包络：42.7 ms 窗
const TICK_MS = 33;       // 分析频率 ~30 Hz

let ac=null, an=null, en=null, src=null, running=false, frozen=false;
let tickTimer=0, rafId=0, wakeLock=null;
let fdb=null, lin=null, envBuf=null;
let lastF0=0;

let envMin=1e9, lastDb=-999, dropList=[], track=null;
let f0Hist=[];

// 分析结果缓冲（绘制线程只读）
let S = {
  f0:0, evenOdd:0, cen:0, hi:0, noise:0, vib:0, perc:0, drop:0,
  merged:[], hits:[], valid:false
};

async function start(){
  try{
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC({sampleRate:48000, latencyHint:"interactive"});
      an = ac.createAnalyser();
      an.fftSize = FFT;
      an.smoothingTimeConstant = 0.45;
      an.minDecibels = -110; an.maxDecibels = -5;
      fdb = new Float32Array(an.frequencyBinCount);
      lin = new Float32Array(an.frequencyBinCount);

      en = ac.createAnalyser();
      en.fftSize = ENV_FFT;
      en.smoothingTimeConstant = 0;
      envBuf = new Float32Array(ENV_FFT);
    }
    await ac.resume();
    const st = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1}
    });
    if(src) src.disconnect();
    src = ac.createMediaStreamSource(st);
    src.connect(an);
    src.connect(en);

    running = true;
    $("dot").className = "dot on";
    $("btn").textContent = "停止";
    $("msg").style.display = "none";

    await keepAwake();
    clearInterval(tickTimer);
    tickTimer = setInterval(analyzeTick, TICK_MS);
    rafId = requestAnimationFrame(rafLoop);
  }catch(e){
    $("dot").className = "dot err";
    const m = $("msg");
    m.style.display = "block";
    m.textContent = "麦克风打开失败：" + (e && e.message ? e.message : e) +
      " —— 页面必须通过 https 或 http://localhost 打开";
  }
}

function stop(){
  running=false;
  clearInterval(tickTimer); tickTimer=0;
  cancelAnimationFrame(rafId); rafId=0;
  releaseWake();
  if(src){ src.disconnect(); src=null; }
  $("dot").className="dot"; $("btn").textContent="开始";
  resetAcc();
}

/* 防锁屏 —— 考试时屏幕自动熄灭会导致分析暂停 */
async function keepAwake(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock=null; });
    }
  }catch(e){ /* 不支持或被拒，不影响主功能 */ }
}
function releaseWake(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && running && !wakeLock) keepAwake();
});

const binHz = () => ac.sampleRate / an.fftSize;

function toLinear(){
  for(let i=0;i<fdb.length;i++){
    const v = fdb[i];
    lin[i] = v < -105 ? 0 : Math.pow(10, v/20);
  }
}

function peakNear(f, tol){
  const b = binHz();
  const i0 = Math.max(1, Math.floor((f-tol)/b));
  const i1 = Math.min(lin.length-2, Math.ceil((f+tol)/b));
  let m=0;
  for(let i=i0;i<=i1;i++) if(lin[i]>m) m = lin[i];
  return m;
}

function medianBetween(f1, f2){
  const b = binHz();
  const i0 = Math.max(2, Math.ceil(f1/b));
  const i1 = Math.min(lin.length-2, Math.floor(f2/b));
  if(i1 <= i0) return 0;
  const t=[];
  for(let i=i0;i<=i1;i++) t.push(lin[i]);
  t.sort((x,y)=>x-y);
  return t[Math.floor(t.length/2)] || 0;
}

function scoreF0(){
  const b = binHz(), sc = new Map();
  const lo = Math.max(2, Math.floor(55/b));
  const hi = Math.min(lin.length-8, Math.floor(1300/b));
  let bestF=0, bestS=-1e18;
  for(let i=lo;i<=hi;i++){
    const f = i*b; let s=0;
    for(let k=1;k<=5;k++){
      const j = Math.round(f*k/b);
      if(j+1 >= lin.length){ s -= 40; break; }
      const m = Math.max(lin[j-1], lin[j], lin[j+1]);
      s += m>0 ? Math.log(m) : -25;
    }
    sc.set(f, s);
    if(s > bestS){ bestS = s; bestF = f; }
  }
  for(const div of [4,3,2]){
    const cand = bestF/div;
    let near=0, nd=1e9;
    for(const f of sc.keys()){
      const d = Math.abs(f-cand);
      if(d < nd){ nd = d; near = f; }
    }
    if(nd/cand < 0.03 && sc.get(near) > bestS - 1.0) return near;
  }
  return bestF;
}

function envStep(){
  en.getFloatTimeDomainData(envBuf);
  let s=0;
  for(let i=0;i<envBuf.length;i++) s += envBuf[i]*envBuf[i];
  const rms = Math.sqrt(s/envBuf.length);
  const db = rms>1e-8 ? 20*Math.log10(rms) : -110;
  const now = performance.now();

  if(db < envMin) envMin = db;

  const isStart = (track===null && dropList.length===0 && db > envMin+6 && lastDb > -900);
  const isRise  = (lastDb > -900 && db-lastDb > 4 && now - (track? track.t : -1e9) > 280);

  if(isStart || isRise) track = {t:now, peak:db, done:false};
  if(track && !track.done){
    if(db > track.peak) track.peak = db;
    if(now - track.t >= 250){
      dropList.push(track.peak - db);
      if(dropList.length > 6) dropList.shift();
      track.done = true;
    }
  }
  lastDb = db;
  return db;
}

function median(a){
  const s=[...a].sort((x,y)=>x-y);
  return s.length ? s[Math.floor(s.length/2)] : 0;
}

/* ================= 分类 ================= */
function regPenalty(f0, reg){
  const lo=Math.log2(reg[0]), hi=Math.log2(reg[1]), x=Math.log2(Math.max(20,f0));
  return x<lo ? lo-x : (x>hi ? x-hi : 0);
}

function classify(F, f0){
  const out = PROTO.map(p=>{
    let d=0;
    for(const k of DIMS){
      const z = (F[k]-p[k])/SIG[k];
      d += WGT[k]*z*z;
    }
    const r = regPenalty(f0, p.reg);
    d += REG_W*r*r;
    return {n:p.n, fam:p.fam, d};
  });
  const mx = Math.max(...out.map(o=>-o.d));
  let sum=0;
  for(const o of out){ o.e = Math.exp(-o.d-mx); sum += o.e; }
  for(const o of out) o.p = o.e/sum;
  return out;
}

/* ================= 规则引擎 ================= */
function ruleEngine(F){
  const hits = [];
  const {f0, evenOdd, cen, hi, noise, vib, perc, drop} = F;

  if(!perc && evenOdd < 0.30)
    hits.push(["R2", `偶次谐波被抑制（偶/奇 = ${evenOdd.toFixed(2)}）`, "簧片族", "单簧管 / 笙"]);

  if(!perc && cen < 2.0){
    if(noise > 0.0008) hits.push(["R3", "谐波质心极低 + 有气声成分", "边棱族", "长笛 / 笛子"]);
    else hits.push(["R3", "谐波质心极低、几乎只有基频", "铜管族", "圆号"]);
  }

  if(!perc && hi > 0.25)
    hits.push(["R4", `高频谐波很强（${(hi*100).toFixed(0)}%）`, "铜管族 / 键盘拨弦族", "小号 / 琵琶 / 唢呐"]);

  if(!perc && cen > 3.6 && vib > 0.28)
    hits.push(["R5", `谐波密 + 颤音明显（${vib.toFixed(2)}）`, "弓弦族", "小提琴 / 中提琴 / 大提琴 / 二胡"]);

  if(perc && drop > 8){
    if(noise > 0.03) hits.push(["R6", `起音锐利 + 噪声大（衰减 ${drop.toFixed(0)} dB）`, "打击族", "木琴 / 定音鼓"]);
    else if(hi > 0.20) hits.push(["R6", `起音锐利 + 高频强（衰减 ${drop.toFixed(0)} dB）`, "键盘拨弦族", "琵琶 / 吉他 / 古筝"]);
    else hits.push(["R6", `起音锐利（衰减 ${drop.toFixed(0)} dB）`, "键盘拨弦族", "钢琴 / 竖琴"]);
  }

  if(!perc && cen > 3.6 && cen < 4.6 && noise < 0.002 && vib < 0.10)
    hits.push(["R1", "无起音瞬态、谐波整齐、无颤音", "风琴族", "管风琴 / 手风琴"]);

  if(!perc && cen > 3.6 && cen < 5.0 && vib >= 0.10 && vib <= 0.28)
    hits.push(["R7", "谐波密、偶次强、颤音很轻", "双簧族", "双簧管（或长号 / 手风琴）"]);

  if(f0 < 165 && cen < 3.0)
    hits.push(["R8", "低音区 + 谐波较少", "铜管族 / 弓弦族", "大号 / 低音提琴"]);

  return hits;
}

/* ================= 分析 tick（30 Hz，与绘制解耦） ================= */
let acc=[];
function resetAcc(){ acc.length=0; }

function analyzeTick(){
  if(!running || frozen || !an) return;

  const db = envStep();
  an.getFloatFrequencyData(fdb);
  toLinear();

  const nf = medianBetween(200, 6000);
  if(db < -74 || nf <= 0){ S.valid=false; resetAcc(); lastF0=0; return; }

  const f0 = scoreF0();
  if(!f0 || f0 < 48){ S.valid=false; resetAcc(); lastF0=0; return; }
  lastF0 = f0;

  const H = [];
  for(let k=1;k<=12;k++) H.push(peakNear(f0*k, Math.max(binHz()*3, f0*k*0.012)));

  let hmax=0, hsum=0;
  for(const v of H){ if(v>hmax) hmax=v; hsum+=v; }
  if(hmax <= nf*2.2 || hsum<=0){ S.valid=false; resetAcc(); return; }

  const hn = H.map(v=>v/hmax);

  let odd=0, even=0;
  for(let k=1;k<=12;k++){ if(k%2) odd += hn[k-1]; else even += hn[k-1]; }
  const evenOdd = odd>1e-6 ? even/odd : 99;
  const eo = Math.log10(Math.max(1e-3, evenOdd));

  let cw=0, cs=0;
  for(let k=1;k<=12;k++){ cw += k*hn[k-1]; cs += hn[k-1]; }
  const cen = cs>0 ? cw/cs : 1;
  const hi = (hn[8]+hn[9]+hn[10]+hn[11])/4;

  let na=0, nc=0;
  for(let k=1;k<=8;k++){
    const a = peakNear(f0*k, Math.max(binHz()*3, f0*k*0.012));
    const b = medianBetween(f0*k*1.20, f0*(k+1)*0.80);
    if(a>0){ na += Math.min(1, b/a); nc++; }
  }
  const noise = nc ? na/nc : 0;

  const drop = dropList.length ? median(dropList) : 0;
  const perc = drop > 8 ? 1 : 0;

  let vib = 0;
  f0Hist.push(f0);
  if(f0Hist.length > 60) f0Hist.shift();
  if(!perc && f0Hist.length >= 40){
    const med = median(f0Hist);
    let v=0;
    for(const f of f0Hist) v += Math.pow(1200*Math.log2(f/med), 2);
    const sd = Math.sqrt(v/f0Hist.length);
    vib = Math.min(1, Math.max(0, (sd-15)/45));
  }

  const F = {eo, cen, hi, perc, noise, vib};
  const ranked = classify(F, f0);

  acc.push(ranked);
  if(acc.length>6) acc.shift();
  const merged = PROTO.map((p,i)=>{
    let t=0; for(const a of acc) t += a[i].p;
    return {n:p.n, fam:p.fam, p:t/acc.length};
  }).sort((a,b)=>b.p-a.p);

  S = { f0, evenOdd, cen, hi, noise, vib, perc, drop,
        merged, hits: ruleEngine({f0, evenOdd, cen, hi, noise, vib, perc, drop}), valid:true };
}

/* ================= 绘制（60 Hz，只读快照） ================= */
const cv = $("spec"), g2 = cv.getContext("2d");
function fitCanvas(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(r.width*dpr);
  cv.height = Math.round(r.height*dpr);
  g2.setTransform(dpr,0,0,dpr,0,0);
}

function drawSpec(){
  const W=cv.clientWidth, H=cv.clientHeight;
  g2.clearRect(0,0,W,H);
  if(!running || !lin) return;

  const b = binHz(), fMax = 8000;
  const iMax = Math.min(lin.length-1, Math.floor(fMax/b));
  let m = 1e-9;
  for(let i=2;i<=iMax;i++) if(lin[i]>m) m = lin[i];
  const top = Math.log10(m+1e-12), span = 3.2;

  // 降采样：每个像素列取该列所有 bin 的最大值，lineTo 次数 = 画布宽度
  const cols = Math.max(60, Math.floor(W));
  g2.beginPath();
  for(let x=0;x<cols;x++){
    const fLo = (x/cols)*fMax, fHi = ((x+1)/cols)*fMax;
    let i0 = Math.max(2, Math.floor(fLo/b));
    let i1 = Math.min(iMax, Math.ceil(fHi/b));
    if(i1 < i0) i1 = i0;
    let mx = 0;
    for(let i=i0;i<=i1;i++) if(lin[i]>mx) mx = lin[i];
    let t = (Math.log10(mx+1e-12) - (top-span))/span;
    t = t<0?0:(t>1?1:t);
    const y = H - t*(H-6) - 3;
    if(x===0) g2.moveTo(0,y); else g2.lineTo(x,y);
  }
  g2.strokeStyle="#3ddc97"; g2.lineWidth=1; g2.stroke();

  g2.strokeStyle="#16202b";
  g2.font="9px system-ui";
  for(const f of [1000,2000,3000,4000,6000]){
    const x=(f/fMax)*W;
    g2.beginPath(); g2.moveTo(x,0); g2.lineTo(x,H); g2.stroke();
    g2.fillStyle="#3f4d5c";
    g2.fillText((f/1000)+"k", x+2, H-2);
  }

  if(lastF0){
    g2.fillStyle="#ffb020";
    g2.strokeStyle="#ffb02055";
    for(let k=1;k<=10;k++){
      const f=lastF0*k; if(f>=fMax) break;
      const x=(f/fMax)*W;
      g2.beginPath(); g2.moveTo(x,0); g2.lineTo(x,11); g2.stroke();
      g2.fillText(k, x+1, 9);
    }
  }
}

/* ================= UI 更新（节流到 8 Hz + 变化才写） ================= */
const lastUI = { ruleHtml:"", candKey:"" };

function setText(id, val){
  const el = $(id);
  if(el.textContent !== val) el.textContent = val;
}

function paintUI(){
  if(!S.valid){
    setText("vF0","—"); setText("vEO","—"); setText("vCEN","—");
    setText("vHI","—"); setText("vATK","—"); setText("vVIB","—");
    if(lastUI.ruleHtml !== "__idle__"){
      $("rule").innerHTML = `<span class="idle">信号太弱或没有稳定音高 —— 等乐句进来</span>`;
      $("cand").innerHTML = "";
      lastUI.ruleHtml = "__idle__"; lastUI.candKey = "";
    }
    return;
  }

  setText("vF0", S.f0.toFixed(0) + " Hz");
  setText("vEO", S.evenOdd < 0.30 ? "抑制" : (S.evenOdd > 0.60 ? "密" : "中"));
  setText("vCEN", S.cen.toFixed(2));
  setText("vHI", (S.hi*100).toFixed(0) + "%");
  setText("vATK", S.perc ? ("锐利 " + S.drop.toFixed(0) + "dB") : "平缓");
  setText("vVIB", S.vib < 0.10 ? "无" : (S.vib > 0.35 ? "明显" : "轻"));

  const hits = S.hits;
  let ruleHtml;
  if(hits.length){
    const h = hits[0];
    ruleHtml = `<span class="r">${h[0]}</span> ${h[1]}<br>` +
      `→ <span class="fam">${h[2]}</span>` +
      `<div class="sub">最可能：${h[3]}</div>` +
      (hits.length>1 ? `<div class="sub">其他命中：${hits.slice(1).map(x=>x[0]+' '+x[2]).join('、')}</div>` : '');
  }else{
    ruleHtml = `<span class="idle">判据不明确 —— 换一个乐句再试</span>`;
  }
  if(ruleHtml !== lastUI.ruleHtml){
    $("rule").innerHTML = ruleHtml;
    lastUI.ruleHtml = ruleHtml;
  }

  // 候选：第一名变化，或任一项变化 ≥2 个百分点才重建
  const top = S.merged.slice(0,5);
  const key = top.map(r=>Math.round(r.p*50)).join(',');
  if(key !== lastUI.candKey){
    $("cand").innerHTML = top.map(r=>{
      const v = r.p*100;
      return `<li><span class="nm">${r.n}</span>` +
        `<span class="bar"><i style="width:${Math.max(2,Math.round(v))}%"></i></span>` +
        `<span class="pc">${v<1?'<1':v.toFixed(0)}%</span></li>`;
    }).join("");
    lastUI.candKey = key;
  }
}

let lastPaint = 0;
let rafLoop = function(){
  rafId = requestAnimationFrame(rafLoop);
  if(!running) return;
  drawSpec();                          // 60 Hz：只画 canvas
  const now = performance.now();
  if(now - lastPaint > 125){           // 8 Hz：读数字，人眼够用
    lastPaint = now;
    paintUI();
  }
};

/* ================= 事件 ================= */
$("btn").onclick = () => { running ? stop() : start(); };

$("freeze").onclick = () => {
  frozen = !frozen;
  $("freeze").textContent = frozen ? "已锁定 · 点击恢复" : "锁定当前读数";
};

$("tabA").onclick = () => {
  $("tabA").classList.add("act"); $("tabB").classList.remove("act");
  $("viewA").classList.remove("hide"); $("viewB").classList.add("hide");
  fitCanvas();
};
$("tabB").onclick = () => {
  $("tabB").classList.add("act"); $("tabA").classList.remove("act");
  $("viewB").classList.remove("hide"); $("viewA").classList.add("hide");
};

window.addEventListener("resize", fitCanvas);
window.addEventListener("orientationchange", ()=>setTimeout(fitCanvas,150));

$("reftable").innerHTML = REF.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("");
$("famtable").innerHTML = FAMINFO.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("");

fitCanvas();

/* ================= Service Worker ================= */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
